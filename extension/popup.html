<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Filter</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1d1d1f;
    --muted: #5f6368;
    --track: #c4c7cc;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --track: #5f6368; --accent: #6b9bff; }
  }
  body {
    margin: 0;
    min-width: 280px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 28px; height: 28px; }
  h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--track); transition: background 0.2s; pointer-events: none; }
  .switch span::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform 0.2s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: 12px 0 0; min-height: 2.8em; color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="icons/icon-48.png" alt="">
  <h1 id="title">Music Filter</h1>
  <label class="switch">
    <input id="enabled" type="checkbox" role="switch" aria-labelledby="title" disabled>
    <span></span>
  </label>
</header>
<p id="status" aria-live="polite"></p>
<script type="module" src="dist/popup.js"></script>
</body>
</html>
