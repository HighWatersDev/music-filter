name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_PACK_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' native/dpdf/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/dpdf

      - name: Cache wasm-pack
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            extension/assets/dpdfnet4.onnx
            extension/assets/dpdfnet2.onnx
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}

      - run: npm run fetch:models
      - run: npm run build:dpdf
      - run: npm run build
      - run: npm test
      - run: npm run package
